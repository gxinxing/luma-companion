name: LumaCompanion
options:
  bundleIdPrefix: luma.core
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
packages:
  # The generated UniFFI Swift bindings as a LOCAL package, one `import LumaCore` away.
  # Sources are produced by `../luma-core/ios/build-core.sh` — run that first.
  LumaCore:
    path: ../luma-core/ios/LumaCore
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    # Link the Rust static archive. These two MUST sit at PROJECT level: at target
    # level the app links clean while any test bundle fails on uniffi_* symbols.
    OTHER_LDFLAGS: -lluma_core
    # Only aarch64 simulator slices are built (Apple silicon).
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    LIBRARY_SEARCH_PATHS[sdk=iphoneos*]: $(SRCROOT)/../luma-core/ios/lib/ios-arm64
    LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]: $(SRCROOT)/../luma-core/ios/lib/ios-arm64-sim
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "3"
    CODE_SIGN_STYLE: Automatic
targets:
  LumaCompanion:
    type: application
    platform: iOS
    sources:
      - LumaCompanion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: luma.core.companion
        PRODUCT_NAME: "LumaCompanion"
        # Free personal team (gxinxing2014@gmail.com) — the real team ID read from
        # Xcode's fresh account session (7X24M4QUV2 was a ghost from the broken old session).
        DEVELOPMENT_TEAM: 2TTT5WBW7Y
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: LumaCompanion/Info.plist
        # Empty entitlements file retained for the existing signing setup. The current
        # three-tab app does not request the glasses' hotspot capability.
        CODE_SIGN_ENTITLEMENTS: LumaCompanion/LumaCompanion.entitlements
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
    info:
      path: LumaCompanion/Info.plist
      properties:
        CFBundleDisplayName: Luma
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSBluetoothAlwaysUsageDescription: >-
          Luma connects to your smart glasses over Bluetooth to read their state,
          take photos and control the camera.
        NSLocalNetworkUsageDescription: >-
          Luma sends captured image stimuli to a swarm console on the same local network.
        # iOS blocks cleartext http by default. A booth console started on a laptop
        # is plain http over the venue LAN, so local networking must be allowed
        # explicitly or every POST /api/stimuli fails before it leaves the phone.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSPhotoLibraryAddUsageDescription: >-
          Luma saves the photos you captured with the glasses into your photo
          library when you swipe a capture card to the right.
    dependencies:
      - package: LumaCore
        product: LumaCore
    scheme:
      testTargets: []
      gatherCoverageData: false
